<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Photo Grid</title>
<style>
  :root { --h: 110px; --gap: 8px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; color: #ddd; min-height: 100%; font: 14px system-ui, sans-serif; overscroll-behavior: none; }

  header {
    position: sticky; top: 0; z-index: 10; background: #000;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px;
  }
  button, .size {
    background: #161616; color: #ddd; border: 1px solid #333; border-radius: 6px;
    padding: 8px 14px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { background: #262626; }
  .size { display: flex; gap: 8px; align-items: center; }
  input[type=range] { width: 110px; accent-color: #ddd; }

  .row {
    display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start;
    gap: var(--gap); padding: 12px; min-height: calc(var(--h) + 24px);
    border-top: 1px solid #333;
  }
  .row.new {
    min-height: 96px; margin: 12px; border: 1px dashed #333; border-radius: 6px;
  }
  .row.new:empty { align-content: center; }
  .row.new:empty::before { content: "Drag a photo here to start a new row"; margin: 0 auto; color: #666; }
  .tile {
    flex: none; width: calc(var(--h) * var(--ratio, 1)); max-width: 100%; cursor: grab; transition: opacity .15s;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tile img { width: 100%; height: auto; display: block; pointer-events: none; }
  .tile.dimmed { opacity: .25; }
  .tile:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .ghost { visibility: hidden; }

  #empty { position: fixed; inset: 0; display: grid; place-items: center; color: #666; pointer-events: none; text-align: center; padding: 24px; }
  [hidden] { display: none !important; }
  body.dropping { outline: 2px dashed #777; outline-offset: -6px; }
</style>
</head>
<body>
<header>
  <button id="add">Add photos</button>
  <button id="clear">Clear all</button>
  <label class="size">Size <input id="size" type="range" min="60" max="420" value="110"></label>
  <input id="file" type="file" accept="image/*" multiple hidden>
</header>

<main id="board"></main>
<div id="empty">Tap “Add photos” to begin</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script>
const board = document.getElementById('board');
const empty = document.getElementById('empty');
const fileInput = document.getElementById('file');
const sizeInput = document.getElementById('size');

// ---------- Rows and photos ----------
// Photos live only in memory: refreshing or closing the page clears them.
function addRow() {
  const row = document.createElement('div');
  row.className = 'row';
  board.append(row);
  if (window.Sortable) {
    Sortable.create(row, {
      group: 'photos',         // lets photos move between rows
      animation: 180,
      ghostClass: 'ghost',
      delay: 200,              // touch: press and hold to drag, swipe to scroll
      delayOnTouchOnly: true,
      touchStartThreshold: 5,
      forceFallback: true,     // same drag behaviour and auto-scroll on all devices
      fallbackOnBody: true,
      fallbackTolerance: 5,
      emptyInsertThreshold: 20,
      onEnd: () => setTimeout(tidy),
    });
  }
  return row;
}

function removeRow(row) {
  window.Sortable?.get(row)?.destroy();
  row.remove();
}

// Remove emptied rows and keep exactly one "new row" drop zone at the bottom
function tidy() {
  for (const row of [...board.children]) {
    if (!row.children.length) removeRow(row);
    else row.classList.remove('new');
  }
  if (board.children.length) addRow().classList.add('new');
  empty.hidden = board.children.length > 0;
}

function addTile(file, row) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.tabIndex = 0;
  tile.setAttribute('role', 'button');
  tile.setAttribute('aria-pressed', 'false');

  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  img.alt = file.name || 'Photo';
  img.draggable = false;
  // Keep each photo's own shape
  img.onload = () => tile.style.setProperty('--ratio', img.naturalWidth / img.naturalHeight);
  // Drop files the browser cannot display
  img.onerror = () => {
    URL.revokeObjectURL(img.src);
    tile.remove();
    tidy();
  };

  tile.append(img);
  row.append(tile);
}

// Each batch of added photos starts as its own row
function addFiles(files) {
  const images = [...files].filter(file => file.type.startsWith('image/'));
  if (!images.length) return;
  const row = addRow();
  images.forEach(file => addTile(file, row));
  tidy();
}

function toggle(tile) {
  tile.setAttribute('aria-pressed', tile.classList.toggle('dimmed'));
}

// ---------- Events ----------
board.addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (tile) toggle(tile);
});

board.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tile')) {
    e.preventDefault();
    toggle(e.target);
  }
});

document.getElementById('add').onclick = () => fileInput.click();
fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ''; };

document.getElementById('clear').onclick = () => {
  if (!board.children.length || !confirm('Remove all photos?')) return;
  board.querySelectorAll('img').forEach(img => URL.revokeObjectURL(img.src));
  [...board.children].forEach(removeRow);
  tidy();
};

function setSize(px) { document.documentElement.style.setProperty('--h', px + 'px'); }
sizeInput.oninput = () => setSize(sizeInput.value);
// Smaller photos on a phone, larger on a computer
sizeInput.value = innerWidth < 600 ? 110 : 200;
setSize(sizeInput.value);

// Drag files in from the desktop (ignored while reordering tiles)
const isFileDrag = e => !(window.Sortable && Sortable.active) && e.dataTransfer.types.includes('Files');
document.addEventListener('dragover', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault();
  document.body.classList.add('dropping');
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget) document.body.classList.remove('dropping');
});
document.addEventListener('drop', e => {
  document.body.classList.remove('dropping');
  if (!isFileDrag(e)) return;
  e.preventDefault();
  addFiles(e.dataTransfer.files);
});

if (!window.Sortable) {
  alert('The drag-and-drop library did not load. Check your connection and refresh.');
}
</script>
</body>
</html>
